name: Unit Tests

on:
  # 指向 v3 的 PR 与推送都跑全量单测，作为合并门禁
  pull_request:
    branches:
      - v3
  push:
    branches:
      - v3
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Architecture Contract Gate
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check event semantic policy
        run: |
          uv run --locked --no-sync pytest \
            tests/test_architecture_dependencies.py \
            tests/test_architecture_adapter_imports.py \
            tests/test_architecture_egress.py \
            tests/test_architecture_event_facts.py \
            tests/test_architecture_event_policy.py -q
          uv run --locked --no-sync python \
            scripts/architecture/event_policy.py

      - name: Check host architecture snapshot
        run: |
          uv run --locked --no-sync pytest \
            tests/test_architecture_contract_baseline.py \
            tests/test_architecture_baseline_cli.py -q
          uv run --locked --no-sync python \
            scripts/architecture/baseline.py --check-host

      - name: Check governed Python types
        run: uv run --locked --no-sync mypy --config-file mypy.ini

      - name: Check complexity ratchet
        run: uv run --locked --no-sync python scripts/architecture/complexity.py

      - name: Check async blocking ratchet
        run: uv run --locked --no-sync python scripts/architecture/async_blocking.py

      - name: Check background task ownership
        run: uv run --locked --no-sync python scripts/architecture/task_ownership.py

      - name: Check process runtime service locators
        run: uv run --locked --no-sync python scripts/architecture/service_locator.py

      - name: Check Ruff diagnostic ratchet
        run: uv run --locked --no-sync python scripts/architecture/ruff_ratchet.py

      - name: Check mypy error ratchet
        run: uv run --locked --no-sync python scripts/architecture/mypy_ratchet.py

      - name: Check startup performance contract
        run: >-
          uv run --locked --no-sync python
          scripts/startup/performance.py --check --repeat 3

  pytest:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Unit Tests (${{ matrix.shard }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/4'
          - shard: '2/4'
          - shard: '3/4'
          - shard: '4/4'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        timeout-minutes: 10
        run: uv run --locked --no-sync python tests/run.py --shard "${{ matrix.shard }}"

  coverage:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Coverage Report
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate coverage reports
        timeout-minutes: 15
        run: |
          uv run --locked --no-sync python -m coverage erase
          uv run --locked --no-sync python -m coverage run tests/run.py --serial
          uv run --locked --no-sync python -m coverage report
          uv run --locked --no-sync python -m coverage json
          uv run --locked --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
          retention-days: 7

      - name: Check coverage ratchet
        run: uv run --locked --no-sync python scripts/architecture/coverage_ratchet.py

  native-update:
    if: github.event_name == 'workflow_dispatch'
    name: Loaded native dependency update / ${{ matrix.name }} / ${{ matrix.installer }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 11 x64 emulated
            runner: windows-11-arm
            artifact-suffix: windows-11-x64-emulated-plugin-helper
            python-version: cpython-3.14.7-windows-x86_64-none
            installer: plugin-helper
            full-project: true
            temporary-lock: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Adapt temporary Windows x64 lock
        if: matrix.temporary-lock == true
        shell: pwsh
        run: |
          foreach ($path in @('pyproject.toml', 'uv.lock')) {
            $content = Get-Content $path -Raw
            $content.Replace(
              "platform_machine == 'AMD64'",
              "platform_machine == 'x86_64'"
            ) | Set-Content $path -Encoding utf8
          }

      - name: Install locked standard runtime
        if: matrix.full-project == true
        run: >-
          uv sync --locked --inexact --no-default-groups
          --group runtime-standard --python ${{ matrix.python-version }}

      - name: Create isolated pip probe environment
        if: matrix.installer == 'pip'
        run: uv venv --seed --python ${{ matrix.python-version }} .probe-venv

      - name: Probe loaded native dependency update
        if: matrix.full-project == true
        env:
          AUTO_UPDATE_RESOURCE: 'false'
          CONFIG_DIR: ${{ runner.temp }}/moviepilot-native-update-config
          MOVIEPILOT_SAFE_MODE: 'true'
          SUPERUSER_PASSWORD: moviepilot-ci-only
        run: >-
          uv run --locked --no-sync python
          -m scripts.probe_native_dependency_update
          --installer ${{ matrix.installer }}
          --output ${{ runner.temp }}/moviepilot-native-update-${{ matrix.artifact-suffix }}.json

      - name: Probe isolated pip update
        if: matrix.installer == 'pip'
        run: >-
          uv run --no-project --python .probe-venv python
          -m scripts.probe_native_dependency_update
          --installer pip
          --output ${{ runner.temp }}/moviepilot-native-update-${{ matrix.artifact-suffix }}.json

      - name: Upload native update evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-dependency-update-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/moviepilot-native-update-${{ matrix.artifact-suffix }}.json
          if-no-files-found: error
