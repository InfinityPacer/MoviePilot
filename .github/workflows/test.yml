name: Unit Tests

on:
  # 指向 v3 的 PR 与推送都跑全量单测，作为合并门禁
  pull_request:
    branches:
      - v3
  push:
    branches:
      - v3
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Architecture Contract Gate
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Check event semantic policy
        run: |
          uv run --locked --no-sync pytest \
            tests/test_architecture_dependencies.py \
            tests/test_architecture_adapter_imports.py \
            tests/test_architecture_egress.py \
            tests/test_architecture_event_facts.py \
            tests/test_architecture_event_policy.py -q
          uv run --locked --no-sync python \
            scripts/architecture/event_policy.py

      - name: Check host architecture snapshot
        run: |
          uv run --locked --no-sync pytest \
            tests/test_architecture_contract_baseline.py \
            tests/test_architecture_baseline_cli.py -q
          uv run --locked --no-sync python \
            scripts/architecture/baseline.py --check-host

      - name: Check governed Python types
        run: uv run --locked --no-sync mypy --config-file mypy.ini

      - name: Check complexity ratchet
        run: uv run --locked --no-sync python scripts/architecture/complexity.py

      - name: Check async blocking ratchet
        run: uv run --locked --no-sync python scripts/architecture/async_blocking.py

      - name: Check background task ownership
        run: uv run --locked --no-sync python scripts/architecture/task_ownership.py

      - name: Check process runtime service locators
        run: uv run --locked --no-sync python scripts/architecture/service_locator.py

      - name: Check Ruff diagnostic ratchet
        run: uv run --locked --no-sync python scripts/architecture/ruff_ratchet.py

      - name: Check mypy error ratchet
        run: uv run --locked --no-sync python scripts/architecture/mypy_ratchet.py

      - name: Check startup performance contract
        run: >-
          uv run --locked --no-sync python
          scripts/startup/performance.py --check --repeat 3

  pytest:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Unit Tests (${{ matrix.shard }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: '1/4'
          - shard: '2/4'
          - shard: '3/4'
          - shard: '4/4'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        timeout-minutes: 10
        run: uv run --locked --no-sync python tests/run.py --shard "${{ matrix.shard }}"

  coverage:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Coverage Report
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate coverage reports
        timeout-minutes: 15
        run: |
          uv run --locked --no-sync python -m coverage erase
          uv run --locked --no-sync python -m coverage run tests/run.py --serial
          uv run --locked --no-sync python -m coverage report
          uv run --locked --no-sync python -m coverage json
          uv run --locked --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
          retention-days: 7

      - name: Check coverage ratchet
        run: uv run --locked --no-sync python scripts/architecture/coverage_ratchet.py

  windows-runtime:
    if: github.event_name == 'workflow_dispatch'
    name: Windows ${{ matrix.profile }} / Python ${{ matrix.python-version }}
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: standard
            python-version: '3.14'
            runtime-group: runtime-standard
          - profile: free-threaded
            python-version: '3.14t'
            runtime-group: runtime-free-threaded

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Expose PostgreSQL build tools
        if: matrix.profile == 'free-threaded'
        shell: pwsh
        run: '"$env:PGBIN" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Install locked runtime dependencies
        run: >-
          uv sync --locked --inexact --no-default-groups
          --group ${{ matrix.runtime-group }}
          --python ${{ matrix.python-version }}

      - name: Verify runtime profile
        env:
          AUTO_UPDATE_RESOURCE: 'false'
          CONFIG_DIR: ${{ runner.temp }}/moviepilot-runtime-smoke
          MOVIEPILOT_SAFE_MODE: 'true'
          SUPERUSER_PASSWORD: moviepilot-ci-only
        run: >-
          uv run --locked --no-sync python -m scripts.verify_runtime_profile
          --expected-profile ${{ matrix.profile }}
          --expected-system Windows
          --expected-machine AMD64

      - name: Verify locked project consistency
        run: >-
          uv sync --locked --offline --inexact --no-default-groups
          --group ${{ matrix.runtime-group }}
          --check --python ${{ matrix.python-version }}

  native-update:
    if: github.event_name == 'workflow_dispatch'
    name: Loaded native dependency update / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            artifact-suffix: linux-x64
          - name: macOS ARM
            runner: macos-15
            artifact-suffix: macos-arm64
          - name: Windows x64
            runner: windows-2025
            artifact-suffix: windows-x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked standard runtime
        run: >-
          uv sync --locked --inexact --no-default-groups
          --group runtime-standard --python 3.14

      - name: Probe loaded native dependency update
        env:
          AUTO_UPDATE_RESOURCE: 'false'
          CONFIG_DIR: ${{ runner.temp }}/moviepilot-native-update-config
          MOVIEPILOT_SAFE_MODE: 'true'
          SUPERUSER_PASSWORD: moviepilot-ci-only
        run: >-
          uv run --locked --no-sync python
          -m scripts.probe_native_dependency_update
          --output ${{ runner.temp }}/moviepilot-native-update-${{ matrix.artifact-suffix }}.json

      - name: Upload native update evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-dependency-update-${{ matrix.artifact-suffix }}
          path: ${{ runner.temp }}/moviepilot-native-update-${{ matrix.artifact-suffix }}.json
          if-no-files-found: error
